<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Appraisal — Fully Rated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #edf4f1; padding: 24px 16px 48px; }
  kpi-appraisal { display: block; max-width: 1200px; margin: 0 auto; }
</style>
</head>
<body>
  <!-- Line manager and Pillar Lead have both rated: every review is shown read-only. -->
  <kpi-appraisal id="appraisal" stage="complete"
    description="Your self-rating alongside your line manager's and Pillar Lead's ratings for each locked KPI."></kpi-appraisal>

<script src="kpi-appraisal.js"></script>
<script>

  document.getElementById('appraisal').data = {
    employee: { name: 'Funke Ajayi', grade: 'Senior Associate', pillar: 'Client Market Engine', practiceArea: 'Public Sector',
                reviewPeriod: 'H2 2026 · 1 July – 31 December 2026' },
    kpis: [
      { id: 'k1', target: 'Achieve monthly sales of 50,000,000', description: 'Meet monthly targets', weight: 25,
        measurement: 'Monthly sales report from the CRM', keyActions: ['Weekly pipeline review', 'Two new public sector leads a month'], timeline: 'Monthly',
        reviews: {
          self:        { rating: 3, comment: 'I met 50% of my target' },
          lineManager: { rating: 2, comment: 'You did not meet up to 50%' },
          pillarLead:  { rating: 2, comment: '' },
        } },
      { id: 'k2', target: 'Maintain a client satisfaction score of 85%', description: 'Keep key accounts satisfied and renewing', weight: 40,
        measurement: 'Quarterly client satisfaction survey', timeline: 'Quarterly',
        reviews: {
          self:        { rating: 4, comment: 'Scored 88% across my four accounts' },
          lineManager: { rating: 4, comment: 'Strong feedback from both public sector clients' },
          pillarLead:  { rating: 3, comment: 'Good, but one account dipped below target in Q3' },
        } },
      { id: 'k3', target: 'Deliver 4 product releases each quarter', description: 'Ship planned releases on schedule', weight: 35,
        measurement: 'Release log signed off by the product owner', keyActions: 'Agree release scope at the start of each quarter', timeline: 'Quarterly',
        reviews: {
          self:        { rating: 3, comment: 'All four releases shipped, one a week late' },
          lineManager: { rating: 3, comment: '' },
          pillarLead:  { rating: 3, comment: 'Agreed' },
        } },
    ],
    signoffs: { employee: { name: 'Funke Ajayi', date: '2026-07-08' }, manager: { name: 'Tari Benson', date: '2026-07-10' } },
  };
</script>
</body>
</html>
