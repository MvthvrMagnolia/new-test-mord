<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #edf4f1;
    --surface: #ffffff;
    --inset: #f7f9f8;
    --ink: #111816;
    --muted: #66706c;
    --faint: #b4bbb8;
    --line: #e3e9e6;
    --brand: #00907a;
    --brand-deep: #14352d;
    --brand-soft: #e3f4ef;
    --brand-ink: #0b5e50;
    --warn: #d98a12;
    --warn-soft: #fdf0dc;
    --warn-ink: #8a5300;
    --track: #e4e8e6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page);
    font-family: Roboto, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 32px 16px;
  }
  .card { max-width: 1200px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  h2 { font-family: Poppins, sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
  .desc { margin-top: 6px; font-size: 14.5px; color: var(--muted); }

  .kpi { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

  /* Target: the hero of each KPI */
  .target {
    position: relative; display: flex; align-items: center; gap: 24px;
    padding: 22px 24px; color: #fff;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(61,187,143,.35), transparent 55%),
      linear-gradient(135deg, var(--brand-deep), #1b4a3d);
  }
  .target::after {   /* faint tile motif from the brand mark */
    content: ""; position: absolute; right: 120px; top: 50%; width: 132px; height: 84px; transform: translateY(-50%);
    background:
      linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)) 0 0 / 40px 40px no-repeat,
      linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)) 46px 0 / 40px 40px no-repeat,
      linear-gradient(rgba(255,255,255,.04), rgba(255,255,255,.04)) 92px 0 / 40px 40px no-repeat,
      linear-gradient(rgba(255,255,255,.04), rgba(255,255,255,.04)) 0 44px / 40px 40px no-repeat,
      linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)) 46px 44px / 40px 40px no-repeat,
      linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)) 92px 44px / 40px 40px no-repeat;
    pointer-events: none;
  }
  .target-main { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 500; letter-spacing: .8px; text-transform: uppercase; color: rgba(255,255,255,.65); }
  .eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .t-label { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.8); }
  .t-value { margin-top: 2px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
  .t-goal { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.8); }

  .weight { position: relative; z-index: 1; flex: none; width: 76px; height: 76px; display: grid; place-items: center; }
  .weight svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .weight b { font-family: Poppins, sans-serif; font-size: 18px; font-weight: 600; line-height: 1; }
  .weight small { display: block; margin-top: 3px; font-size: 10px; letter-spacing: .6px; text-transform: uppercase; color: rgba(255,255,255,.7); text-align: center; }

  /* Reviews */
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); }
  .review { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
  .review + .review { border-left: 1px solid var(--line); }
  .who { display: flex; align-items: center; gap: 10px; }
  .badge { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--brand-ink); background: var(--brand-soft); }
  .who-name { font-size: 14px; font-weight: 600; }
  .who-role { font-size: 12px; color: var(--muted); }

  .rating { display: flex; align-items: center; gap: 14px; }
  .big { font-family: Poppins, sans-serif; font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .big span { font-size: 14px; font-weight: 500; color: var(--faint); }
  .scale { display: flex; gap: 4px; margin-top: 6px; }
  .scale i { width: 22px; height: 6px; border-radius: 3px; background: var(--track); }
  .label { font-size: 14px; font-weight: 500; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tone-low .big, .tone-low .label { color: var(--warn-ink); }
  .tone-low .scale i.on { background: var(--warn); }
  .tone-mid .big, .tone-mid .label { color: var(--brand-ink); }
  .tone-mid .scale i.on { background: var(--brand); }
  .tone-high .big, .tone-high .label { color: var(--brand-deep); }
  .tone-high .scale i.on { background: var(--brand-deep); }

  .comment {
    position: relative; font-size: 13.5px; line-height: 1.5;
    padding: 10px 12px 10px 14px; border-radius: 10px; background: var(--inset);
    border-left: 3px solid var(--brand);
  }
  .tone-low .comment { border-left-color: var(--warn); }
  .comment.none { background: none; border-left: 3px solid var(--line); color: var(--faint); font-style: italic; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--inset); }
  .gap { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .gap b { color: var(--warn-ink); font-weight: 600; }
  .gap.agree b { color: var(--brand-ink); }
  .link { appearance: none; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font: 500 13px Roboto, sans-serif; color: var(--brand-ink); padding: 6px 8px; border-radius: 8px; }
  .link:hover { background: var(--brand-soft); }

  @media (max-width: 820px) {
    .reviews { grid-template-columns: 1fr; }
    .review + .review { border-left: 0; border-top: 1px solid var(--line); }
    .target::after { display: none; }
  }
  @media (max-width: 480px) {
    .card { padding: 20px; }
    .target { padding: 18px; gap: 14px; }
    .t-value { font-size: 28px; }
    .weight { width: 64px; height: 64px; }
    .foot { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <section class="card" aria-labelledby="kpis-title">
    <h2 id="kpis-title">KPIs</h2>
    <p class="desc">The ratings given for each of your locked KPIs this cycle.</p>
    <div id="kpis"></div>
  </section>

<script>
  // KPI data as it comes from the system. The target text is split into a label and a figure for display.
  const KPIS = [
    {
      target: 'Monthly target of 50,000,000',
      goal: 'Meet monthly targets',
      weight: 25,
      reviews: [
        { who: 'Employee',     role: 'Self-rating', rating: 3, label: 'Meets Expectation', comment: 'I met 50% of my target' },
        { who: 'Line manager', role: 'Review',      rating: 2, label: 'Below Expectation', comment: 'You did not meet up to 50%' },
        { who: 'Pillar Lead',  role: 'Review',      rating: 2, label: 'Below Expectation', comment: '' },
      ],
    },
  ];

  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const tone = r => r <= 2 ? 'tone-low' : r === 3 ? 'tone-mid' : 'tone-high';

  // "Monthly target of 50,000,000" → ["Monthly target", "50,000,000"]; anything else stays whole.
  function splitTarget(t) {
    const m = t.match(/^(.*?)\s+of\s+([\d.,]+.*)$/i);
    return m ? [m[1], m[2]] : ['Target', t];
  }

  function weightRing(pct) {
    const r = 33, c = 2 * Math.PI * r;
    return `<div class="weight" aria-label="Weight ${pct}%">
      <svg viewBox="0 0 76 76" width="100%" height="100%" aria-hidden="true">
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="5"/>
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="#3dbb8f" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}"/>
      </svg>
      <div><b>${pct}%</b><small>weight</small></div>
    </div>`;
  }

  function gapNote(reviews) {
    const self = reviews.find(r => r.role === 'Self-rating');
    const others = reviews.filter(r => r !== self);
    if (!self || !others.length) return '';
    const last = others[others.length - 1];
    const d = last.rating - self.rating;
    if (d === 0) return `<span class="gap agree"><b>In agreement</b> with your self-rating</span>`;
    return `<span class="gap">${esc(last.who)} rated <b>${Math.abs(d)} ${d < 0 ? 'lower' : 'higher'}</b> than your self-rating</span>`;
  }

  document.getElementById('kpis').innerHTML = KPIS.map((k, i) => {
    const [label, value] = splitTarget(k.target);
    return `<article class="kpi">
      <div class="target">
        <div class="target-main">
          <div class="eyebrow">KPI ${i + 1}<span class="dot"></span>Locked</div>
          <div class="t-label">${esc(label)}</div>
          <div class="t-value">${esc(value)}</div>
          ${k.goal ? `<div class="t-goal">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="3.3" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r=".9" fill="currentColor"/></svg>
            ${esc(k.goal)}</div>` : ''}
        </div>
        ${weightRing(k.weight)}
      </div>

      <div class="reviews">
        ${k.reviews.map(r => `<div class="review ${tone(r.rating)}">
          <div class="who">
            <span class="badge" aria-hidden="true">${initials(r.who)}</span>
            <div><div class="who-name">${esc(r.who)}</div><div class="who-role">${esc(r.role)}</div></div>
          </div>
          <div class="rating">
            <div>
              <div class="big">${r.rating}<span> / 5</span></div>
              <div class="scale" aria-hidden="true">${[1,2,3,4,5].map(n => `<i class="${n <= r.rating ? 'on' : ''}"></i>`).join('')}</div>
            </div>
            <div>
              <div class="label">${esc(r.label)}</div>
              <div class="meta">Weighted ${(r.rating * k.weight / 100).toFixed(2)}</div>
            </div>
          </div>
          ${r.comment ? `<p class="comment">${esc(r.comment)}</p>` : `<p class="comment none">No comment provided</p>`}
        </div>`).join('')}
      </div>

      <div class="foot">
        ${gapNote(k.reviews)}
        <button class="link">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.2h2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 5.2V8l2 1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Review history
        </button>
      </div>
    </article>`;
  }).join('');
</script>
</body>
</html>
